services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: myto
      POSTGRES_PASSWORD: myto
      POSTGRES_DB: myto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myto -d myto"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://myto:myto@db:5432/myto
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data: {}
