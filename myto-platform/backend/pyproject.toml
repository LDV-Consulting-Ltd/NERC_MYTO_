[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myto-backend"
version = "0.1.0"
description = "MYTO Platform ELT backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.1",
    "alembic>=1.13",
    "httpx>=0.26",
    "selectolax>=0.3",
    "tenacity>=8.2",
    "pymupdf>=1.24",
    "camelot-py[cv]>=0.11",
    "rapidfuzz>=3.6",
    "geopy>=2.4",
    "orjson>=3.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "geoalchemy2>=0.14",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]
