[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myto-backend"
version = "0.1.0"
description = "MYTO Platform ELT backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary,pool]>=3.1",
    "alembic>=1.13",
    "httpx>=0.26",
    "selectolax>=1.0",
    "tenacity>=8.2",
    "rapidfuzz>=3.6",
    "geopy>=2.4",
    "orjson>=3.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "geoalchemy2>=0.14",
]

[project.optional-dependencies]
# Heavy PDF extractors (OpenCV via camelot[cv], PyMuPDF). Required for Docker ETL;
# omitted from Vercel API bundles to stay under the 500 MB function size limit.
etl = [
    "pymupdf>=1.24",
    "camelot-py[cv]>=0.11",
]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

# Vercel FastAPI service entrypoint (backend/main.py re-exports app from src/)
[tool.vercel]
entrypoint = "main:app"
